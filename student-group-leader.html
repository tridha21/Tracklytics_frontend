<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ProTrack | Group Management</title>

  <link
    rel="stylesheet"
    href="https://site-assets.fontawesome.com/releases/v6.5.1/css/all.css"
  />

  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="student-group-leader.css" />
</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand">
      <img src="image/logo.png" alt="logo" />
      <div class="brand-text">
        <span class="brand-name">ProTrack</span>
        <small class="brand-tagline">
          Multi-Guide Project & Evaluation Management System
        </small>
      </div>
    </div>

    <!-- STUDENT DROPDOWN -->
    <div class="user-dropdown">
      <div class="user-info" id="studentMenuBtn">
        <img src="image/user.png" />
        <div>
          <strong id="studentName"></strong>
          <span>Student</span>
        </div>
        <i class="fa-solid fa-chevron-down"></i>
      </div>

      <div class="dropdown-menu" id="studentDropdown">
        <button onclick="location.href='HomeStudent.html'">
          <i class="fa-solid fa-house"></i> Home
        </button>
        <button id="logoutBtn">
          <i class="fa-solid fa-right-from-bracket"></i> Log out
        </button>
      </div>
    </div>
  </header>

  <!-- BREADCRUMB -->
  <div class="breadcrumb" id="breadcrumb">
    <a href="HomeStudent.html">Home</a>
  </div>

  <!-- PAGE HEADER -->
  <section class="page-header">
    <h1 id="projectTitle"></h1>

    <div class="invite">
      <span>Invite Code:</span>
      <strong id="inviteCode"></strong>
      <button id="copyBtn" title="Copy Invite Code">
        <i class="fa-regular fa-copy"></i>
      </button>
    </div>

    <p id="maxMembersText"></p>

    <button class="exit-btn">Exit Group</button>
  </section>

  <!-- CONTENT -->
  <main class="group-container">

    <!-- APPROVAL REQUESTS -->
    <section class="card" id="approvalSection">
      <h3>Approval Requests</h3>
      <div id="approvalList"></div>
      <p class="empty" id="approvalEmpty">No pending requests found.</p>
    </section>

    <!-- TEAM MEMBERS -->
    <section class="card">
      <h3>Team Members</h3>
      <div id="teamList"></div>
    </section>

  </main>

  <script src="student-group-leader.js"></script>
</body>
</html>
